<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CEO Library</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>

*{
 box-sizing:border-box;
}

html,body{
 margin:0;
 width:100%;
 min-height:100%;
 font-family:Arial,sans-serif;
 background:#f5f6f8;
 color:#202124;
}


/* =========================
   HEADER
========================= */

header{
 height:64px;
 background:white;
 border-bottom:1px solid #ddd;
 display:flex;
 align-items:center;
 padding:0 25px;
}

header h1{
 margin:0;
 font-size:22px;
}


/* =========================
   LIBRARY
========================= */

#library{
 max-width:1200px;
 margin:auto;
 padding:25px;
}

.folder{
 margin-bottom:30px;
}

.folderTitle{
 font-size:18px;
 font-weight:600;
 margin:15px 0;
}

.subfolder{
 margin-left:15px;
}

.grid{
 display:grid;
 grid-template-columns:
 repeat(auto-fill,minmax(210px,1fr));
 gap:15px;
}

.card{
 background:white;
 border:1px solid #ddd;
 border-radius:9px;
 padding:16px;
 cursor:pointer;
 min-height:120px;
 transition:.15s;
 box-shadow:0 2px 5px rgba(0,0,0,.05);
}

.card:hover{
 transform:translateY(-2px);
 box-shadow:0 5px 15px rgba(0,0,0,.12);
}

.pdfIcon{
 font-size:32px;
 margin-bottom:10px;
}

.pdfName{
 font-size:14px;
 line-height:1.45;
 word-break:break-word;
}

#loadingLibrary{
 text-align:center;
 padding:60px;
}


/* =========================
   VIEWER
========================= */

#viewer{
 display:none;
 position:fixed;
 inset:0;
 background:#e8eaed;
 z-index:9999;
}

#toolbar{
 height:54px;
 background:white;
 border-bottom:1px solid #ccc;
 display:flex;
 align-items:center;
 gap:7px;
 padding:6px 10px;
 box-shadow:0 1px 5px rgba(0,0,0,.08);
}

#documentTitle{
 flex:1;
 overflow:hidden;
 white-space:nowrap;
 text-overflow:ellipsis;
 font-size:14px;
}

button{
 border:1px solid #ccc;
 background:white;
 border-radius:6px;
 padding:7px 11px;
 cursor:pointer;
}

button:hover{
 background:#f1f3f4;
}

button:disabled{
 opacity:.35;
 cursor:default;
}

#pageInfo{
 min-width:75px;
 text-align:center;
 font-size:13px;
}


/* =========================
   CANVAS
========================= */

#canvasArea{
 height:calc(100vh - 54px);
 overflow:auto;
 padding:18px;
 display:flex;
 justify-content:center;
 align-items:flex-start;
}

#canvasWrapper{
 position:relative;
}

#pdfCanvas{
 display:block;
 background:white;
 box-shadow:0 3px 15px rgba(0,0,0,.20);
}

#loadingPDF{
 position:absolute;
 top:30px;
 left:50%;
 transform:translateX(-50%);
 background:white;
 padding:10px 18px;
 border-radius:7px;
 box-shadow:0 2px 8px rgba(0,0,0,.15);
 display:none;
}


/* =========================
   MOBILE
========================= */

@media(max-width:650px){

 header{
  padding:0 12px;
 }

 #library{
  padding:12px;
 }

 .grid{
  grid-template-columns:
  repeat(2,1fr);
 }

 .card{
  padding:12px;
  min-height:105px;
 }

 #toolbar{
  gap:3px;
  padding:5px;
 }

 button{
  padding:6px 8px;
  font-size:12px;
 }

 #documentTitle{
  display:none;
 }

}

</style>

</head>


<body>


<header>

<h1>CEO Library</h1>

</header>


<div id="library">

<div id="loadingLibrary">
Đang tải thư viện...
</div>

</div>



<!-- =========================
     PDF VIEWER
========================= -->

<div id="viewer">


<div id="toolbar">


<button onclick="closeViewer()">
← Thư viện
</button>


<div id="documentTitle"></div>


<button
 id="prevBtn"
 onclick="prevPage()">
◀
</button>


<span id="pageInfo">

<span id="pageNum">1</span>
/
<span id="pageCount">0</span>

</span>


<button
 id="nextBtn"
 onclick="nextPage()">
▶
</button>


<button onclick="zoomOut()">
−
</button>


<button onclick="fitWidth()">
Vừa trang
</button>


<button onclick="zoomIn()">
+
</button>


<button onclick="fullScreen()">
⛶
</button>


</div>



<div id="canvasArea">

<div id="canvasWrapper">

<canvas id="pdfCanvas"></canvas>

<div id="loadingPDF">
Đang tải...
</div>

</div>

</div>


</div>



<script>

/* ======================================
   DÁN URL APPS SCRIPT /exec VÀO ĐÂY
====================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbzN9sa2eVvqxnVRJYaXcLow9EiFWJzCpDj3ZTe_vPHaohXX4wgBlEj2C1jo_nAUvMaI/exec";


/* ======================================
   PDF.JS
====================================== */

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


let pdfDoc = null;

let pageNum = 1;

let scale = 1.2;

let rendering = false;

let pendingPage = null;


const canvas =
document.getElementById("pdfCanvas");

const ctx =
canvas.getContext("2d");


/* ======================================
   LOAD LIBRARY
====================================== */

async function loadLibrary(){

 try{

  const response =
  await fetch(API_URL);

  if(!response.ok){
   throw new Error(
    "HTTP " + response.status
   );
  }


  const data =
  await response.json();


  if(!data.success){
   throw new Error(data.error);
  }


  const library =
  document.getElementById("library");


  library.innerHTML="";


  renderItems(
   data.items,
   library
  );


 }catch(error){

  console.error(error);

  document.getElementById("library")
  .innerHTML =
  "<p>Không tải được thư viện tài liệu.</p>";

 }

}



/* ======================================
   RENDER FOLDER / FILE
====================================== */

function renderItems(items,parent){


 const folders =
 items.filter(
  x => x.type==="folder"
 );


 const pdfs =
 items.filter(
  x => x.type==="pdf"
 );


 /* PDF trong folder hiện tại */

 if(pdfs.length){

  const grid =
  document.createElement("div");

  grid.className="grid";


  pdfs.forEach(file=>{

   const card =
   document.createElement("div");

   card.className="card";


   const icon =
   document.createElement("div");

   icon.className="pdfIcon";

   icon.textContent="PDF";


   const name =
   document.createElement("div");

   name.className="pdfName";

   name.textContent=file.name;


   card.appendChild(icon);

   card.appendChild(name);


   card.onclick=function(){

    openPDF(
     file.name,
     file.url
    );

   };


   grid.appendChild(card);

  });


  parent.appendChild(grid);

 }


 /* Folder con */

 folders.forEach(folder=>{

  const box =
  document.createElement("div");

  box.className="folder";


  const title =
  document.createElement("div");

  title.className="folderTitle";

  title.textContent =
  folder.name;


  box.appendChild(title);


  const content =
  document.createElement("div");

  content.className="subfolder";


  box.appendChild(content);

  parent.appendChild(box);


  renderItems(
   folder.items,
   content
  );

 });

}



/* ======================================
   OPEN PDF
====================================== */

async function openPDF(name,url){

 document.getElementById(
  "viewer"
 ).style.display="block";


 document.body.style.overflow=
 "hidden";


 document.getElementById(
  "documentTitle"
 ).textContent=name;


 document.getElementById(
  "loadingPDF"
 ).style.display="block";


 pageNum=1;

 scale=1.2;


 try{

  const loadingTask =
  pdfjsLib.getDocument({
   url:url
  });


  pdfDoc =
  await loadingTask.promise;


  document.getElementById(
   "pageCount"
  ).textContent=
  pdfDoc.numPages;


  await fitWidth();


 }catch(error){

  console.error(error);

  alert(
   "Không tải được PDF.\n\n" +
   "Kiểm tra quyền chia sẻ của file Google Drive."
  );

 }


 document.getElementById(
  "loadingPDF"
 ).style.display="none";

}



/* ======================================
   RENDER PAGE
====================================== */

async function renderPage(num){

 if(!pdfDoc)
  return;


 if(rendering){

  pendingPage=num;

  return;

 }


 rendering=true;


 document.getElementById(
  "loadingPDF"
 ).style.display="block";


 const page =
 await pdfDoc.getPage(num);


 const viewport =
 page.getViewport({
  scale:scale
 });


 canvas.width =
 Math.floor(viewport.width);


 canvas.height =
 Math.floor(viewport.height);


 await page.render({

  canvasContext:ctx,

  viewport:viewport

 }).promise;


 rendering=false;


 document.getElementById(
  "loadingPDF"
 ).style.display="none";


 document.getElementById(
  "pageNum"
 ).textContent=
 pageNum;


 updateButtons();


 if(pendingPage!==null){

  const next =
  pendingPage;

  pendingPage=null;

  renderPage(next);

 }

}



/* ======================================
   PAGE CONTROL
====================================== */

function prevPage(){

 if(!pdfDoc || pageNum<=1)
  return;

 pageNum--;

 renderPage(pageNum);

 scrollViewerTop();

}


function nextPage(){

 if(
  !pdfDoc ||
  pageNum>=pdfDoc.numPages
 )
 return;

 pageNum++;

 renderPage(pageNum);

 scrollViewerTop();

}



/* ======================================
   ZOOM
====================================== */

function zoomIn(){

 scale += .15;

 renderPage(pageNum);

}


function zoomOut(){

 if(scale<=.4)
  return;

 scale -= .15;

 renderPage(pageNum);

}



/* ======================================
   FIT WIDTH
====================================== */

async function fitWidth(){

 if(!pdfDoc)
  return;


 const page =
 await pdfDoc.getPage(pageNum);


 const viewport =
 page.getViewport({
  scale:1
 });


 const area =
 document.getElementById(
  "canvasArea"
 );


 const available =
 area.clientWidth - 40;


 scale =
 available /
 viewport.width;


 if(scale>2.2)
  scale=2.2;


 await renderPage(pageNum);

}



/* ======================================
   BUTTON STATUS
====================================== */

function updateButtons(){

 document.getElementById(
  "prevBtn"
 ).disabled =
 pageNum<=1;


 document.getElementById(
  "nextBtn"
 ).disabled =
 pageNum>=pdfDoc.numPages;

}



/* ======================================
   CLOSE
====================================== */

function closeViewer(){

 document.getElementById(
  "viewer"
 ).style.display="none";


 document.body.style.overflow="";


 pdfDoc=null;


 canvas.width=1;

 canvas.height=1;

}



/* ======================================
   FULLSCREEN
====================================== */

function fullScreen(){

 const viewer =
 document.getElementById(
  "viewer"
 );


 if(!document.fullscreenElement){

  viewer.requestFullscreen();

 }else{

  document.exitFullscreen();

 }

}



/* ======================================
   SCROLL TOP
====================================== */

function scrollViewerTop(){

 document.getElementById(
  "canvasArea"
 ).scrollTop=0;

}



/* ======================================
   KEYBOARD
====================================== */

window.addEventListener(
 "keydown",
 function(e){

  if(
   document.getElementById(
    "viewer"
   ).style.display!=="block"
  )
  return;


  if(e.key==="ArrowLeft")
   prevPage();


  if(e.key==="ArrowRight")
   nextPage();


  if(e.key==="Escape")
   closeViewer();

 }
);



/* ======================================
   START
====================================== */

loadLibrary();

</script>

</body>
</html>
```
