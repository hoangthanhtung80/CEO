```html
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CEO Library</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f4f6f8;
 color:#202124;
}

header{
 background:white;
 padding:18px 25px;
 border-bottom:1px solid #ddd;
}

header h2{
 margin:0;
 font-size:22px;
}

#library{
 padding:20px;
 max-width:1200px;
 margin:auto;
}

.folder{
 margin-bottom:25px;
}

.folder-title{
 font-size:18px;
 font-weight:bold;
 margin-bottom:12px;
}

.files{
 display:grid;
 grid-template-columns:
 repeat(auto-fill,minmax(210px,1fr));
 gap:15px;
}

.file{
 background:white;
 border:1px solid #ddd;
 border-radius:9px;
 padding:16px;
 cursor:pointer;
 min-height:110px;
 box-shadow:0 2px 5px rgba(0,0,0,.05);
 transition:.15s;
}

.file:hover{
 transform:translateY(-2px);
 box-shadow:0 4px 12px rgba(0,0,0,.12);
}

.icon{
 font-size:30px;
 margin-bottom:10px;
}

.name{
 font-size:14px;
 line-height:1.4;
}

#viewer{
 display:none;
 position:fixed;
 inset:0;
 background:white;
 z-index:1000;
}

#viewerbar{
 height:50px;
 display:flex;
 align-items:center;
 gap:12px;
 padding:6px 12px;
 border-bottom:1px solid #ddd;
 background:white;
}

#viewerTitle{
 flex:1;
 overflow:hidden;
 white-space:nowrap;
 text-overflow:ellipsis;
}

button{
 padding:7px 13px;
 border:1px solid #ccc;
 border-radius:6px;
 background:white;
 cursor:pointer;
}

button:hover{
 background:#eee;
}

iframe{
 width:100%;
 height:calc(100vh - 50px);
 border:0;
}

#loading{
 text-align:center;
 padding:50px;
}

.subfolder{
 margin-left:15px;
 margin-top:20px;
}

@media(max-width:600px){
 #library{padding:10px}

 .files{
  grid-template-columns:
  repeat(2,1fr);
 }

 .file{
  min-height:100px;
  padding:12px;
 }
}
</style>
</head>

<body>

<header>
<h2>CEO Library</h2>
</header>

<div id="library">
 <div id="loading">Đang tải thư viện...</div>
</div>


<div id="viewer">

 <div id="viewerbar">

  <button onclick="closeViewer()">← Thư viện</button>

  <div id="viewerTitle"></div>

  <button onclick="fullscreen()">⛶</button>

 </div>

 <iframe id="pdfFrame"></iframe>

</div>


<script>

/* =========================================
   THAY URL APPS SCRIPT CỦA ANH Ở ĐÂY
========================================= */

const API =
"https://script.google.com/macros/s/AKfycbzN9sa2eVvqxnVRJYaXcLow9EiFWJzCpDj3ZTe_vPHaohXX4wgBlEj2C1jo_nAUvMaI/exec";


async function loadLibrary(){

 try{

  const response =
  await fetch(API + "?action=library");

  const data =
  await response.json();

  if(!data.success)
   throw new Error(data.error);

  const library =
  document.getElementById("library");

  library.innerHTML="";

  renderItems(
   data.folders,
   library
  );

 }catch(err){

  document.getElementById("library")
  .innerHTML =
  "<p>Không tải được thư viện.</p>";

  console.error(err);

 }

}


function renderItems(items,parent){

 items.forEach(item=>{

  if(item.type==="folder"){

   const folder =
   document.createElement("div");

   folder.className="folder";

   const title =
   document.createElement("div");

   title.className="folder-title";

   title.textContent =
   item.name;

   folder.appendChild(title);

   const content =
   document.createElement("div");

   content.className="subfolder";

   folder.appendChild(content);

   parent.appendChild(folder);

   renderItems(
    item.children,
    content
   );

  }

 });


 const files =
 items.filter(
  item=>item.type==="file"
 );


 if(files.length){

  const grid =
  document.createElement("div");

  grid.className="files";


  files.forEach(file=>{

   const card =
   document.createElement("div");

   card.className="file";

   card.innerHTML =
   '<div class="icon">📄</div>'+
   '<div class="name">'+
   escapeHTML(file.name)+
   '</div>';


   card.onclick=()=>{

    openPDF(
     file.name,
     file.preview
    );

   };


   grid.appendChild(card);

  });


  parent.appendChild(grid);

 }

}


function openPDF(name,url){

 document.getElementById(
  "viewerTitle"
 ).textContent=name;

 document.getElementById(
  "pdfFrame"
 ).src=url;

 document.getElementById(
  "viewer"
 ).style.display="block";

 document.body.style.overflow="hidden";

}


function closeViewer(){

 document.getElementById(
  "viewer"
 ).style.display="none";

 document.getElementById(
  "pdfFrame"
 ).src="";

 document.body.style.overflow="";

}


function fullscreen(){

 const viewer =
 document.getElementById("viewer");

 if(!document.fullscreenElement){

  viewer.requestFullscreen();

 }else{

  document.exitFullscreen();

 }

}


function escapeHTML(text){

 const div =
 document.createElement("div");

 div.textContent=text;

 return div.innerHTML;

}


loadLibrary();

</script>

</body>
</html>
```
